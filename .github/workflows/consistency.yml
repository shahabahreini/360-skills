name: Consistency

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Skills match the docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-consistency.mjs
